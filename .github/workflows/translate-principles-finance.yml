name: Translate Principles of Finance to Indonesian

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out workflow branch
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libreoffice-writer fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install requests python-docx pymupdf

      - name: Download source PDF
        run: |
          python .github/scripts/download_source.py
          pdfinfo principles-finance.pdf | grep -E '^Pages:'

      - name: Translate and create deliverables
        run: python .github/scripts/translate_book.py principles-finance.pdf output

      - name: Upload Indonesian translation or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Principles_of_Finance_Terjemahan_Indonesia
          path: |
            output/
            source-discovery.txt
          if-no-files-found: warn
          retention-days: 7
