name: Translate Principles of Finance to Indonesian

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    steps:
      - name: Check out workflow branch
        uses: actions/checkout@v4

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils libreoffice-writer fonts-dejavu-core
          python -m pip install --upgrade pip
          python -m pip install requests python-docx

      - name: Download source PDF
        run: |
          curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 \
            -A "Mozilla/5.0" \
            "https://assets.openstax.org/oscms-prodcms/media/documents/PrinciplesofFinance-WEB.pdf" \
            -o principles-finance.pdf
          pdfinfo principles-finance.pdf | grep -E '^Pages:'

      - name: Translate and create deliverables
        run: python .github/scripts/translate_book.py principles-finance.pdf output

      - name: Upload Indonesian translation
        uses: actions/upload-artifact@v4
        with:
          name: Principles_of_Finance_Terjemahan_Indonesia
          path: output/
          if-no-files-found: error
          retention-days: 7
