name: Apply DAHLAH7 Personal Source

on:
  push:
    branches: [personal-v1]
    paths:
      - ".github/workflows/apply-personal-source.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: personal-v1
          fetch-depth: 0
      - name: Restore final source
        shell: bash
        run: |
          printf '%s' '' | base64 -d > /tmp/d7src.tgz
          tar -xzf /tmp/d7src.tgz -C .
          git config user.name "dahlah77"
          git config user.email "hidayatromi358@gmail.com"
          git add index.html styles.css app.js favicon.svg
          if git diff --cached --quiet; then
            echo "No source changes needed"
          else
            git commit -m "Install hand-built DAHLAH7 personal portfolio [skip ci]"
            git push origin personal-v1
          fi
